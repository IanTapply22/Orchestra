[versions]
h2 = "2.4.240"
hikari = "7.1.0"
junit = "6.1.2"
paper = "26.2.build.111-stable"
postgresql = "42.7.13"
velocity = "4.0.0"
testcontainers = "2.0.5"
archunit = "1.5.0"
awaitility = "4.3.0"

[libraries]
h2 = { module = "com.h2database:h2", version.ref = "h2" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
testcontainers-junit = { module = "org.testcontainers:testcontainers-junit-jupiter", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }
velocity-api = { module = "com.velocitypowered:velocity-api", version.ref = "velocity" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }
awaitility = { module = "org.awaitility:awaitility", version.ref = "awaitility" }
