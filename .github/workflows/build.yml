name: Build and verify

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wrapper-validation:
    name: Validate Gradle wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6

  build:
    name: Unit and static checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v6

      - name: Verify with Gradle
        run: ./gradlew check javadoc jar -x :orchestra-distribution:integrationTest --no-daemon

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.os }}
          path: "**/build/reports/**"
          if-no-files-found: ignore

  integration:
    name: PostgreSQL and Redis integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v6

      - name: Run infrastructure integration tests
        run: ./gradlew :orchestra-distribution:integrationTest --no-daemon

      - name: Collect container logs on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p build/container-logs
          docker ps -aq | while read -r container; do
            name="$(docker inspect --format '{{.Name}}' "$container" | tr -d '/')"
            docker inspect "$container" > "build/container-logs/${name}-inspect.json" || true
            docker logs "$container" > "build/container-logs/${name}.log" 2>&1 || true
          done

      - name: Upload integration diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-diagnostics-ubuntu
          path: |
            **/build/reports/**
            build/container-logs/**
          if-no-files-found: ignore

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
