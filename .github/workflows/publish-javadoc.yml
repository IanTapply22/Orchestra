name: Deploy Javadoc

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: javadoc-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build aggregate Javadocs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Generate aggregate Javadocs with Gradle
        run: ./gradlew javadoc --no-daemon

      - name: Prepare Pages content
        shell: bash
        run: |
          mkdir -p build/pages/javadoc
          cp -R build/docs/javadoc/. build/pages/javadoc/
          touch build/pages/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/pages

  deploy:
    name: Deploy aggregate Javadocs
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Javadocs
        id: deployment
        uses: actions/deploy-pages@v5
